<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuuma&Toimi keskustelutesti</title><script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f6f8f5;color:#405047}main{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:900px;margin:auto;padding:20px;gap:14px}header{background:#edf3ee;padding:16px 20px;border-radius:18px}h1{font-size:22px;margin:0 0 5px}p{margin:0;color:#68766e}#status{font-size:14px;margin-top:7px}#webchat{min-height:0;background:#fff;border:1px solid #dfe8e1;border-radius:20px;overflow:hidden;box-shadow:0 15px 40px rgba(76,96,84,.1)}</style></head><body><main><header><h1>Tuuma&Toimi, keskusteluyhteyden testi</h1><p>Tämä sivu testaa vain keskustelua. Varsinainen etusivu pysyy ennallaan.</p><div id="status">Yhdistetään…</div></header><div id="webchat" role="main"></div></main><script>(async()=>{const s=document.getElementById('status');try{if(!window.WebChat)throw new Error('WebChat ei latautunut');const r=await fetch('https://tuuma-ja-toimi-token.mikko-hallamaa-1e3.workers.dev/',{cache:'no-store'});if(!r.ok)throw new Error('Worker vastasi '+r.status);const d=await r.json();if(!d.token)throw new Error('Token puuttuu');const userID='dl_'+crypto.randomUUID();const directLine=window.WebChat.createDirectLine({token:d.token});window.WebChat.renderWebChat({directLine,userID,username:'Käyttäjä',locale:'fi-FI',styleOptions:{accent:'#6f8978',backgroundColor:'#fffdf9',botAvatarInitials:'T&T',userAvatarInitials:'Sinä',bubbleBackground:'#edf3ee',bubbleFromUserBackground:'#7f9888',bubbleFromUserTextColor:'#fff',sendBoxPlaceholder:'Kirjoita viesti…'}},document.getElementById('webchat'));s.textContent='Yhteys muodostettu. Kirjoita viesti alareunan kenttään.';directLine.postActivity({from:{id:userID,role:'user'},type:'event',name:'startConversation',value:{language:'fi-FI'}}).subscribe(()=>{},()=>{});}catch(e){s.textContent='Virhe: '+e.message;s.style.color='#9b3b2f';console.error(e);}})();</script></body></html>
